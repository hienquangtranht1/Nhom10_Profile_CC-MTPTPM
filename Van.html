<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Trương Vũ Minh Vân</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* 1. Cấu hình chung */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Màu nền Gradient tím xanh hiện đại */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        /* 2. Thẻ Card chứa thông tin */
        .profile-card {
            position: relative;
            width: 350px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-10px);
        }

        /* Phần Header màu sắc bên trên */
        .card-header {
            height: 120px;
            background: linear-gradient(to right, #ff9966, #ff5e62);
        }

        /* 3. Ảnh đại diện */
        .avatar-container {
            width: 140px;
            height: 140px;
            margin: -70px auto 10px; /* Đẩy ảnh lên trên header */
            border-radius: 50%;
            border: 5px solid #fff;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            background-color: #fff;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 4. Thông tin cá nhân */
        .info-section {
            padding: 0 20px 30px;
        }

        .name {
            font-size: 24px;
            color: #333;
            font-weight: 600;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .mssv {
            color: #ff5e62;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .group-name {
            color: #777;
            font-size: 14px;
            margin-bottom: 15px;
            background: #f0f0f0;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 50px;
        }

        .description {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* 5. Nút liên hệ (Social Icons) */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .social-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            transition: all 0.3s;
            font-size: 18px;
        }

        .facebook { background: #3b5998; }
        .github { background: #333; }
        .email { background: #ea4335; }

        .social-btn:hover {
            transform: scale(1.1) rotate(360deg);
        }

    </style>
</head>
<body>

    <div class="profile-card">
        <div class="card-header"></div>

        <div class="avatar-container">
            <img src="https://cdn-icons-png.flaticon.com/512/6858/6858504.png" alt="Avatar Minh Vân">
        </div>

        <div class="info-section">
            <h2 class="name">Trương Vũ Minh Vân</h2>
            <p class="mssv">MSSV: 2280603646</p>
            <span class="group-name">Thành viên Nhóm 10</span>
            
            <p class="description">
                Xin chào! Mình là sinh viên ngành Công nghệ thông tin. 
                Mình yêu thích lập trình Web, Java và tìm hiểu về Git Flow.
                Rất vui được kết nối với mọi người!
            </p>

            <div class="social-links">
                <a href="#" class="social-btn facebook" title="Facebook">
                    <i class="fab fa-facebook-f"></i>
                </a>
                <a href="#" class="social-btn github" title="GitHub">
                    <i class="fab fa-github"></i>
                </a>
                <a href="mailto:van@example.com" class="social-btn email" title="Gửi Email">
                    <i class="fas fa-envelope"></i>
                </a>
            </div>
        </div>
    </div>

</body>
</html>
